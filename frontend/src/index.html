<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>לומדים ביחד</title>
    <base href="/" />
    <meta name="theme-color" content="#215c4d" />
    <meta name="description" content="מרחב משפחתי ליצירת תרגול אישי, צעד אחר צעד." />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script>
      // Applies a saved theme before first paint; see Theme. Without one, CSS follows the device.
      try {
        const theme = localStorage.getItem('theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>כדי להשתמש באפליקציה, יש להפעיל ג׳אווהסקריפט בהגדרות הדפדפן.</noscript>
  </body>
</html>
