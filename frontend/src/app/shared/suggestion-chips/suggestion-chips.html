<p [id]="key() + '-suggestions'" class="text-sm font-medium text-muted">{{ label() }}</p>
<ul role="list" class="grid gap-2 sm:grid-cols-2" [attr.aria-labelledby]="key() + '-suggestions'">
  @for (suggestion of suggestions(); track suggestion) {
    <li class="grid">
      <button type="button" class="chip" [disabled]="disabled()" (click)="picked.emit(suggestion)">
        <span class="icon icon-ai" aria-hidden="true"></span>{{ suggestion }}
      </button>
    </li>
  }
</ul>
