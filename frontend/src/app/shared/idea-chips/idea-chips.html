<p [id]="key() + '-ideas'" class="text-sm font-medium text-muted">{{ label() }}</p>
<ul role="list" class="flex flex-wrap gap-2" [attr.aria-labelledby]="key() + '-ideas'">
  @for (idea of ideas(); track idea) {
    <li>
      <button type="button" class="chip" [disabled]="disabled()" (click)="picked.emit(idea)">
        <span class="icon icon-ai text-brand" aria-hidden="true"></span>{{ idea }}
      </button>
    </li>
  }
</ul>
