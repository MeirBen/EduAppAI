<a
  class="button fixed inset-s-4 top-4 z-50 -translate-y-32 focus:translate-y-0"
  href="#main-content"
  (click)="$event.preventDefault(); mainContent.focus()"
  >דילוג לתוכן הראשי</a
>
<header class="app-header">
  <div
    class="app-frame flex flex-wrap items-center justify-between gap-x-4 gap-y-2 py-3 pinned-header:h-full pinned-header:py-0"
  >
    <a class="brand" [routerLink]="homeUrl()" aria-label="לומדים ביחד — עמוד הבית">
      <span class="brand-mark" aria-hidden="true"><span class="icon icon-book"></span></span>
      <span [class.max-sm:hidden]="compactBrand()">לומדים ביחד</span>
    </a>
    <ng-content select="[shell-navigation]" />
  </div>
</header>
<main #mainContent id="main-content" tabindex="-1" class="app-frame flex-1 py-6 sm:py-main">
  <app-loading-indicator
    variant="bar"
    [active]="busy() || !!router.currentNavigation()"
    [label]="busy() ? 'מתנתקים…' : 'פותחים את המרחב…'"
  />
  @if (update.broken()) {
    <div class="error mb-6 flex flex-wrap items-center gap-x-4" role="alert">
      <p>הגרסה של האתר שנשמרה בדפדפן כבר לא זמינה. יש לטעון את העמוד מחדש.</p>
      <ng-container [ngTemplateOutlet]="reload" />
    </div>
  } @else if (update.ready()) {
    <div class="callout mb-6 flex flex-wrap items-center gap-x-4" role="status">
      <p>גרסה חדשה של האתר מוכנה.</p>
      <ng-container [ngTemplateOutlet]="reload" />
    </div>
  }
  <ng-content />
</main>
<footer class="app-footer">
  <div
    class="app-frame flex flex-wrap items-center justify-between gap-x-6 gap-y-3 py-4 pinned-header:h-full pinned-header:py-0"
  >
    <p class="text-sm text-muted">לומדים ביחד · בקצב של המשפחה שלכם</p>
    <app-theme-picker />
  </div>
</footer>

<ng-template #reload>
  <button class="text-link" type="button" (click)="update.reload()">
    <span class="icon icon-refresh" aria-hidden="true"></span>טעינה מחדש
  </button>
</ng-template>
