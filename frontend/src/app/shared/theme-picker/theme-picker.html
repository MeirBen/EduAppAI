<fieldset class="flex items-center gap-0.5 rounded-full bg-soft p-1">
  <legend class="sr-only">מצב תצוגה</legend>
  @for (option of options; track option.value) {
    <label
      class="relative m-0 grid size-9 cursor-pointer place-items-center rounded-full text-muted transition-colors not-has-checked:hover:text-ink has-checked:bg-brand has-checked:text-on-brand forced-colors:has-checked:border-2 has-focus-visible:outline-2 has-focus-visible:outline-offset-2 has-focus-visible:outline-focus"
    >
      <input
        class="sr-only"
        type="radio"
        name="theme"
        [value]="option.value"
        [checked]="theme.preference() === option.value"
        (change)="theme.select(option.value)"
      />
      <span class="icon" [class]="option.icon" aria-hidden="true"></span>
      <span class="tooltip">{{ option.label }}</span>
    </label>
  }
</fieldset>
