@let f = fields();
<fieldset class="grid min-w-0 gap-4">
  <legend>{{ label() }}</legend>
  <div>
    <label [for]="prefix() + '-length-mode'">הנחיית אורך</label>
    <select [id]="prefix() + '-length-mode'" [formField]="f.mode">
      <option value="">ללא בקשת אורך</option>
      <option value="target">מספר מילים רצוי, בקירוב</option>
      <option value="exact">מספר מילים מדויק</option>
      <option value="range">טווח מילים קבוע</option>
    </select>
  </div>
  @if (f.mode().value() === 'range') {
    <div class="grid gap-4 sm:grid-cols-2">
      <div>
        <label [for]="prefix() + '-lower'">מינימום מילים</label
        ><input [id]="prefix() + '-lower'" dir="ltr" inputmode="numeric" [formField]="f.lower" />
      </div>
      <div>
        <label [for]="prefix() + '-upper'">מקסימום מילים</label
        ><input [id]="prefix() + '-upper'" dir="ltr" inputmode="numeric" [formField]="f.upper" />
      </div>
    </div>
  } @else if (f.mode().value()) {
    <div>
      <label [for]="prefix() + '-words'">מספר מילים</label
      ><input [id]="prefix() + '-words'" dir="ltr" inputmode="numeric" [formField]="f.value" />
    </div>
    <label class="flex items-center gap-2"
      ><input [id]="prefix() + '-adjustable'" type="checkbox" [formField]="f.adjustable" />אפשר
      לשנות בכל פעילות</label
    >
    @if (f.adjustable().value()) {
      <div class="grid gap-4 sm:grid-cols-2">
        <div>
          <label [for]="prefix() + '-min'">מינימום לבחירה (רשות)</label
          ><input [id]="prefix() + '-min'" dir="ltr" inputmode="numeric" [formField]="f.min" />
        </div>
        <div>
          <label [for]="prefix() + '-max'">מקסימום לבחירה (רשות)</label
          ><input [id]="prefix() + '-max'" dir="ltr" inputmode="numeric" [formField]="f.max" />
        </div>
      </div>
    }
  }
</fieldset>
