@let f = fields();
<fieldset class="grid min-w-0 gap-4">
  <legend>{{ label() }}</legend>
  <div>
    <label [for]="prefix() + '-length-mode'">הנחיית אורך</label>
    <select [id]="prefix() + '-length-mode'" [formField]="f.mode">
      <option value="">ללא בקשת אורך</option>
      <option value="target">מספר מילים משוער</option>
      <option value="range">טווח מילים מחייב</option>
    </select>
  </div>
  @if (f.mode().value() === 'range') {
    <div class="grid gap-4 sm:grid-cols-2">
      <div>
        <label [for]="prefix() + '-lower'">מינימום מילים</label
        ><input [id]="prefix() + '-lower'" dir="ltr" inputmode="numeric" [formField]="f.lower" />
      </div>
      <div>
        <label [for]="prefix() + '-upper'">מקסימום מילים</label
        ><input [id]="prefix() + '-upper'" dir="ltr" inputmode="numeric" [formField]="f.upper" />
      </div>
    </div>
  } @else if (f.mode().value()) {
    <div>
      <label [for]="prefix() + '-words'">מספר מילים</label
      ><input [id]="prefix() + '-words'" dir="ltr" inputmode="numeric" [formField]="f.value" />
    </div>
  }
</fieldset>
