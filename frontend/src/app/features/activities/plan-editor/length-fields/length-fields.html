@let f = fields();
<fieldset class="grid min-w-0 gap-4 sm:grid-cols-2">
  <legend>{{ label() }}</legend>
  <div>
    <label [for]="prefix() + '-length-mode'">הנחיית אורך</label>
    <select
      [id]="prefix() + '-length-mode'"
      [formField]="f.mode"
      [attr.aria-describedby]="prefix() + '-length-mode-errors'"
    >
      <option value="">ללא בקשת אורך</option>
      <option value="target">מספר מילים משוער</option>
      <option value="range">טווח מילים מחייב</option>
    </select>
    <app-field-errors [id]="prefix() + '-length-mode-errors'" [field]="f.mode" />
  </div>
  @if (f.mode().value() === 'range') {
    <div class="flex flex-wrap gap-4">
      <div>
        <label [for]="prefix() + '-lower'">מינימום מילים</label
        ><input
          [id]="prefix() + '-lower'"
          dir="ltr"
          inputmode="numeric"
          [formField]="f.lower"
          [attr.aria-describedby]="prefix() + '-lower-errors'"
        />
        <app-field-errors [id]="prefix() + '-lower-errors'" [field]="f.lower" />
      </div>
      <div>
        <label [for]="prefix() + '-upper'">מקסימום מילים</label
        ><input
          [id]="prefix() + '-upper'"
          dir="ltr"
          inputmode="numeric"
          [formField]="f.upper"
          [attr.aria-describedby]="prefix() + '-upper-errors'"
        />
        <app-field-errors [id]="prefix() + '-upper-errors'" [field]="f.upper" />
      </div>
    </div>
  } @else if (f.mode().value()) {
    <div>
      <label [for]="prefix() + '-words'">מספר מילים</label
      ><input
        [id]="prefix() + '-words'"
        dir="ltr"
        inputmode="numeric"
        [formField]="f.value"
        [attr.aria-describedby]="prefix() + '-words-errors'"
      />
      <app-field-errors [id]="prefix() + '-words-errors'" [field]="f.value" />
    </div>
  }
</fieldset>
