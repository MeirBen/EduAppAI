<div class="grid gap-2">
  <button
    #trigger
    type="button"
    class="text-link"
    [id]="key() + '-improve'"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="key() + '-improve-form'"
    [disabledInteractive]="disabled()"
    (click)="open.set(!open())"
  >
    <span class="icon icon-ai" aria-hidden="true"></span>שיפור בעזרת AI<span class="sr-only">
      — {{ name() }}</span
    >
  </button>
  <form
    [id]="key() + '-improve-form'"
    class="well grid gap-4"
    [hidden]="!open()"
    (submit)="$event.preventDefault(); submit()"
  >
    <div>
      <label [for]="key() + '-instruction'">{{ prompt() }}</label>
      <textarea
        [id]="key() + '-instruction'"
        dir="auto"
        rows="2"
        [formField]="fields.instruction"
        [attr.aria-describedby]="key() + '-instruction-help'"
      ></textarea>
      <p [id]="key() + '-instruction-help'" class="mt-2 text-sm text-muted">
        אפשר להשאיר ריק. רק החלק הזה יוחלף, ושאר הפעילות לא תשתנה.
      </p>
    </div>
    @if (ideas().length) {
      <app-idea-chips
        [key]="key() + '-improve'"
        label="רעיונות לשיפור"
        [ideas]="ideas()"
        [disabled]="disabled()"
        (picked)="pick($event)"
      />
    }
    <div class="flex flex-wrap items-center gap-3">
      <button
        type="submit"
        class="button button-secondary"
        [id]="key() + '-improve-submit'"
        [disabledInteractive]="disabled()"
      >
        <span class="icon icon-ai" aria-hidden="true"></span>{{ submitLabel() }}
      </button>
      <button type="button" class="text-link" (click)="close()">
        <span class="icon icon-close" aria-hidden="true"></span>ביטול
      </button>
    </div>
  </form>
</div>
