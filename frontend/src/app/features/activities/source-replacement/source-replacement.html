<section class="panel grid gap-4" aria-labelledby="replacement-title">
  <h2 id="replacement-title">החלפת הטקסט</h2>
  <div>
    <label for="replacement-source">הטקסט החדש — יישמר בדיוק כפי שהוזן</label>
    <textarea
      id="replacement-source"
      dir="auto"
      rows="8"
      [formField]="field()"
      (input)="typed.emit()"
      aria-describedby="replacement-source-help replacement-source-errors"
    ></textarea>
    <app-field-errors id="replacement-source-errors" [field]="field()" />
    <p id="replacement-source-help" class="mt-2 text-sm text-muted">
      עד {{ limits.bodyLength | number }} תווים. אחרי ההחלפה השאלות והטקסטים שנוצרו יסומנו לבדיקה.
    </p>
  </div>
  @if (error()) {
    <p class="field-error" role="alert">{{ error() }}</p>
  }
  <div class="flex flex-wrap items-center gap-3">
    <button
      class="button"
      type="button"
      [disabledInteractive]="locked()"
      id="accept-source-replacement"
      (click)="accepted.emit()"
    >
      <span class="icon icon-check" aria-hidden="true"></span>אישור הטקסט החדש
    </button>
    <button
      class="text-link"
      type="button"
      [disabledInteractive]="locked()"
      (click)="cancelled.emit()"
    >
      <span class="icon icon-close" aria-hidden="true"></span>ביטול
    </button>
  </div>
</section>
