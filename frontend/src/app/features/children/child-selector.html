<div class="grid gap-2">
  <label
    ><span class="mb-2 block">{{ label() }}</span
    ><select
      [value]="value()"
      [disabled]="disabled() || children.isLoading()"
      (change)="choose($event)"
    >
      <option value="">{{ emptyLabel() }}</option>
      @for (child of options(); track child.id) {
        <option [value]="child.id" [disabled]="!allowDisabled() && !child.enabled">
          &#x2068;{{ child.name }}&#x2069;{{ child.enabled ? '' : ' (מושבת)' }}
        </option>
      }
    </select></label
  >
  <app-loading-indicator [active]="children.isLoading()" label="טוענים פרופילים…" />
  @if (children.error()) {
    <p class="field-error" role="alert">{{ failure(children.error()) }}</p>
    <button
      class="text-link"
      [disabledInteractive]="disabled() || children.isLoading()"
      (click)="children.reload()"
    >
      <span class="icon icon-refresh" aria-hidden="true"></span>רענון הפרופילים
    </button>
  }
  @if (children.hasValue()) {
    @if (!children.value().items.length) {
      <p class="text-sm text-muted">
        {{ page() === 1 ? 'עוד לא הוספתם ילדים.' : 'אין פרופילים נוספים.' }}
      </p>
    }
    <app-pager
      label="עמודי בחירת פרופיל"
      [(page)]="page"
      [hasMore]="children.value().hasMore"
      [busy]="disabled() || children.isLoading()"
    />
  }
</div>
