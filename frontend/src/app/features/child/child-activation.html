<section class="panel mx-auto grid max-w-lg gap-6" aria-labelledby="activation-title">
  <header class="grid gap-1">
    <h1 id="activation-title" class="text-2xl">כניסה לפעילויות</h1>
    <p class="text-muted">כתבו את הקוד שקיבלתם מההורה.</p>
  </header>
  <form class="grid gap-4" (submit)="activate($event)" novalidate>
    <div>
      <label for="activation-code">הקוד מההורה</label>
      <input
        id="activation-code"
        type="text"
        class="tracking-widest uppercase"
        dir="ltr"
        autocomplete="off"
        autocapitalize="characters"
        spellcheck="false"
        [formField]="fields.code"
        aria-describedby="activation-code-errors"
      />
      <app-field-errors id="activation-code-errors" [field]="fields.code" />
    </div>
    <button class="button" type="submit" [disabledInteractive]="busy() || recovery()">כניסה</button>
  </form>
  <app-loading-indicator [active]="busy()" label="רק רגע…" />
  @if (error()) {
    <p class="field-error" role="alert">{{ error() }}</p>
  }
  @if (recovery()) {
    <button
      id="check-child-access"
      class="button button-secondary"
      [disabledInteractive]="busy()"
      (click)="checkAccess()"
    >
      בדיקת הכניסה
    </button>
  }
  <p class="note">
    <span class="icon icon-info" aria-hidden="true"></span>אחרי הכניסה, המכשיר הזה יזכור אתכם עד 30
    יום.
  </p>
</section>
