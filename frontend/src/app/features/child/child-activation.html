<app-entry-layout audience="child" heading="כניסה לפעילויות" lead="כתבו כאן את הקוד מההורה.">
  <form class="grid gap-stack" (submit)="activate($event)" novalidate>
    <div>
      <label for="activation-code">הקוד מההורה</label>
      <input
        id="activation-code"
        type="text"
        class="code"
        dir="ltr"
        autocomplete="off"
        autocapitalize="characters"
        spellcheck="false"
        [formField]="fields.code"
        aria-describedby="activation-code-errors"
      />
      <app-field-errors id="activation-code-errors" [field]="fields.code" />
    </div>
    <button class="button w-full" type="submit" [disabledInteractive]="busy() || recovery()">
      כניסה
    </button>
  </form>
  <app-loading-indicator [active]="busy()" label="רק רגע…" />
  @if (error()) {
    <p class="field-error" role="alert">{{ error() }}</p>
  }
  @if (recovery()) {
    <button
      id="check-child-access"
      class="button button-secondary w-full"
      [disabledInteractive]="busy()"
      (click)="checkAccess()"
    >
      בדיקת הכניסה
    </button>
  }
  <p class="note">
    <span class="icon icon-info" aria-hidden="true"></span>אחרי שנכנסים, לא צריך קוד שוב במשך 30
    יום.
  </p>
</app-entry-layout>
