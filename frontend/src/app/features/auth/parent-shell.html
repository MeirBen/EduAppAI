<app-page-shell homeUrl="/" [compactBrand]="auth.signedIn()" [busy]="signingOut()">
  <div shell-navigation>
    @if (auth.signedIn()) {
      <nav class="flex flex-wrap items-center gap-1" aria-label="ניווט ראשי">
        <a
          class="nav-link"
          routerLink="/activities"
          routerLinkActive
          [routerLinkActiveOptions]="{ exact: true }"
          ariaCurrentWhenActive="page"
          ><span class="icon icon-home" aria-hidden="true"></span><span>המרחב שלנו</span></a
        >
        <a class="nav-link" routerLink="/children" routerLinkActive ariaCurrentWhenActive="page"
          ><span class="icon icon-users" aria-hidden="true"></span><span>הילדים</span></a
        >
        <a class="nav-link" routerLink="/assignments" routerLinkActive ariaCurrentWhenActive="page"
          ><span class="icon icon-tasks" aria-hidden="true"></span><span>פעילויות לילדים</span></a
        >
        <button
          class="nav-link nav-link-quiet"
          (click)="logout()"
          [disabledInteractive]="signingOut()"
        >
          <span class="icon icon-sign-out" aria-hidden="true"></span
          ><span>{{ signingOut() ? 'מתנתקים…' : 'יציאה' }}</span>
        </button>
      </nav>
    } @else {
      <span class="hidden text-sm text-muted sm:block">קצת תרגול. הרבה סקרנות.</span>
    }
  </div>
  @if (error()) {
    <p class="error mb-6" role="alert">{{ error() }}</p>
  }
  <router-outlet />
</app-page-shell>
