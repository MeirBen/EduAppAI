<app-entry-layout heading="כניסת הורים" lead="טוב שחזרתם. נכנסים למרחב הלמידה המשפחתי.">
  <form
    class="grid gap-stack"
    (submit)="signIn($event)"
    novalidate
    [attr.aria-busy]="fields().submitting()"
  >
    <div>
      <label for="email">כתובת דוא״ל</label>
      <input
        id="email"
        type="email"
        dir="ltr"
        autocomplete="username"
        [formField]="fields.email"
        aria-describedby="email-error"
      />
      <app-field-errors id="email-error" [field]="fields.email" />
    </div>
    <div>
      <label for="password">סיסמה</label>
      <input
        id="password"
        type="password"
        dir="ltr"
        autocomplete="current-password"
        [formField]="fields.password"
        aria-describedby="password-error"
      />
      <app-field-errors id="password-error" [field]="fields.password" />
    </div>
    @if (error()) {
      <p class="field-error" role="alert">{{ error() }}</p>
    }
    <button class="button w-full" type="submit" [disabledInteractive]="fields().submitting()">
      {{ fields().submitting() ? 'מתחברים…' : 'כניסה למרחב שלנו' }}
    </button>
  </form>
  <app-loading-indicator [active]="fields().submitting()" label="מתחברים למרחב שלכם…" />
</app-entry-layout>
