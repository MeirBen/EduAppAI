<a
  class="button fixed inset-s-4 top-4 z-50 -translate-y-32 focus:translate-y-0"
  href="#main-content"
  (click)="$event.preventDefault(); mainContent.focus()"
  >דילוג לתוכן הראשי</a
>
<header
  class="border-b border-line bg-surface/85 backdrop-blur-md pinned-header:sticky pinned-header:inset-bs-0 pinned-header:z-20"
>
  <div
    class="group mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-x-4 gap-y-2 px-gutter py-3 sm:px-8"
  >
    <a
      class="flex min-h-11 items-center gap-3 text-lg font-semibold text-brand"
      routerLink="/"
      aria-label="לומדים ביחד — עמוד הבית"
    >
      <span
        class="grid size-11 shrink-0 place-items-center rounded-inset bg-linear-to-bl from-brand to-brand-hover ltr:bg-linear-to-br text-on-brand shadow-button"
        aria-hidden="true"
      >
        <span class="icon icon-book size-6"></span>
      </span>
      <span class="max-sm:group-has-[nav]:hidden">לומדים ביחד</span>
    </a>
    <div class="flex flex-wrap items-center gap-x-4 gap-y-2">
      @if (auth.signedIn()) {
        <nav class="flex flex-wrap items-center gap-2" aria-label="ניווט ראשי">
          <a
            class="nav-link"
            routerLink="/templates"
            routerLinkActive
            [routerLinkActiveOptions]="{ exact: true }"
            ariaCurrentWhenActive="page"
            ><span class="icon icon-home" aria-hidden="true"></span><span>המרחב שלנו</span></a
          >
          <button class="nav-link text-muted" (click)="logout()" [disabled]="signingOut()">
            <span class="icon icon-sign-out" aria-hidden="true"></span
            ><span>{{ signingOut() ? 'מתנתקים…' : 'יציאה' }}</span>
          </button>
        </nav>
      } @else {
        <span class="hidden text-sm text-muted sm:block">קצת תרגול. הרבה סקרנות.</span>
      }
      <app-theme-picker />
    </div>
  </div>
</header>
<main
  #mainContent
  id="main-content"
  tabindex="-1"
  class="mx-auto w-full max-w-6xl flex-1 px-gutter py-6 sm:px-8"
>
  @if (error()) {
    <p class="error mb-6" role="alert">{{ error() }}</p>
  }
  <app-loading-indicator
    variant="bar"
    [active]="signingOut() || !!router.currentNavigation()"
    [label]="signingOut() ? 'מתנתקים מהחשבון…' : 'פותחים את המרחב…'"
  />
  <router-outlet />
</main>
<footer class="border-t border-line">
  <p class="mx-auto max-w-6xl px-gutter py-6 text-sm text-muted sm:px-8">
    לומדים ביחד · בקצב של המשפחה שלכם
  </p>
</footer>
