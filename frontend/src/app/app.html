<a
  class="fixed inset-s-4 top-4 z-50 -translate-y-32 rounded-xl bg-brand px-5 py-3 text-on-brand focus:translate-y-0"
  href="#main-content"
  (click)="$event.preventDefault(); mainContent.focus()"
  >דילוג לתוכן הראשי</a
>
<header
  class="border-b border-line/70 bg-surface/85 backdrop-blur-md pinned-header:sticky pinned-header:inset-bs-0 pinned-header:z-20"
>
  <div
    class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-x-6 gap-y-2 px-gutter py-3 sm:px-8"
  >
    <a
      class="flex min-h-11 items-center gap-3 text-lg font-semibold text-brand"
      routerLink="/"
      aria-label="לומדים ביחד — עמוד הבית"
    >
      <span
        class="grid size-11 shrink-0 place-items-center rounded-2xl bg-linear-to-bl from-brand to-brand-hover ltr:bg-linear-to-br text-on-brand shadow-button"
        aria-hidden="true"
      >
        <svg
          class="size-6"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
        >
          <path d="M12 6c-3-2-6-2-9-1v14c3-1 6-1 9 1 3-2 6-2 9-1V5c-3-1-6-1-9 1Zm0 0v14" />
        </svg>
      </span>
      לומדים ביחד
    </a>
    <div class="flex flex-wrap items-center gap-x-4 gap-y-2">
      @if (auth.signedIn()) {
        <nav class="flex flex-wrap items-center gap-2" aria-label="ניווט ראשי">
          <a
            class="nav-link"
            routerLink="/templates"
            routerLinkActive
            [routerLinkActiveOptions]="{ exact: true }"
            ariaCurrentWhenActive="page"
            >המרחב שלנו</a
          >
          <button class="nav-link text-muted" (click)="logout()" [disabled]="signingOut()">
            {{ signingOut() ? 'מתנתקים…' : 'יציאה מהחשבון' }}
          </button>
        </nav>
      } @else {
        <span class="hidden text-sm text-muted sm:block">קצת תרגול. הרבה סקרנות.</span>
      }
      <app-theme-picker />
    </div>
  </div>
</header>
<main
  #mainContent
  id="main-content"
  tabindex="-1"
  class="mx-auto min-h-[75vh] max-w-6xl px-gutter py-6 sm:px-8"
>
  @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
  }
  <app-loading-indicator
    class="mb-6"
    [active]="signingOut() || !!router.currentNavigation()"
    [label]="signingOut() ? 'מתנתקים מהחשבון…' : 'פותחים את המרחב…'"
  />
  <router-outlet />
</main>
<footer class="mx-auto max-w-6xl border-t border-line px-gutter py-6 text-sm text-muted sm:px-8">
  לומדים ביחד · בקצב של המשפחה שלכם
</footer>
